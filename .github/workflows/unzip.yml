name: Auto Unzip

on:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract zip files and commit
        run: |
          shopt -s globstar nullglob
          for zip_file in *.zip **/*.zip; do
            # 確保檔案存在（避免重複處理）
            [[ -f "$zip_file" ]] || continue
            
            target_dir="${zip_file%.zip}"
            mkdir -p "$target_dir"
            unzip -o "$zip_file" -d "$target_dir"
            rm "$zip_file"
          done

          if [[ -n $(git status --porcelain) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@://github.com"
            git add -A
            git commit -m "Auto extract zip files"
            git push
          fi
