        // === Google Sheets 來源 ===

        // === 備用模擬資料 ===
        const FALLBACK_MEMORIES = [

        const JOB_CATEGORIES = [
            {
                category: '基本職',
                jobs: [
                { name: '戰士', slots: ['彩色', '黃色', '黃色'], recommendedSort: 'comprehensive' },
                { name: '魔法使', slots: ['彩色', '紫色', '紫色'], recommendedSort: 'comprehensive' },
                { name: '僧侶', slots: ['彩色', '綠色', '綠色'], recommendedSort: 'heal' },

                ]
            },
            {

                { name: '聖騎士', slots: ['彩色', '黃色/綠色', '黃色/綠色', '黃色/綠色'], recommendedSort: 'comprehensive' },
                { name: '賢者', slots: ['彩色', '紫色/綠色', '紫色/綠色', '紫色/綠色'], recommendedSort: 'comprehensive' },
                { name: '遊俠', slots: ['彩色', '紅色/藍色', '紅色/藍色', '紅色/藍色'], recommendedSort: 'comprehensive' }
                ]
            }
        ];

        const PHYSICAL_JOBS = ['戰士', '盜賊', '武術家', '聖騎士', '遊俠'];

        const SORT_OPTIONS = [
            { value: 'comprehensive', label: '綜合評分' },
            { value: 'atk_matk', label: '攻擊+魔攻' },
            { value: 'atk', label: '攻擊力' },
            { value: 'matk', label: '攻擊魔力' },
            { value: 'heal', label: '回復魔力' },
            { value: 'def', label: '守備力' },
            { value: 'mdef', label: '魔法守備力' },
            { value: 'dex', label: '靈巧' },
            { value: 'hp', label: '最大 HP' }
        ];

        // === CSV 處理工具 ===
        const parseCSV = (str) => {
            const arr = [];
            let quote = false;
            let row = 0, col = 0;
            for (let c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';

                if (cc === '"' && quote && nc === '"') { arr[row][col] += cc; ++c; continue; }
                if (cc === '"') { quote = !quote; continue; }
                if (cc === ',' && !quote) { ++col; continue; }
                if (cc === '\r' && nc === '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc === '\n' && !quote) { ++row; col = 0; continue; }
                if (cc === '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr.filter(row => row.some(cell => cell && cell.trim() !== ''));
        };

        const parseSafeNumber = (val) => {
            if (!val) return 0;
            const parsed = Number(val.replace(/[^0-9.-]+/g, ''));
            return isNaN(parsed) ? 0 : parsed;
        };

        const normalizeColor = (rawColor) => {
            if (!rawColor) return '彩色';
            const c = rawColor.toLowerCase();
            if (c.includes('紅') || c.includes('赤') || c.includes('red')) return '紅色';
            if (c.includes('綠') || c.includes('緑') || c.includes('green')) return '綠色';
            if (c.includes('藍') || c.includes('青') || c.includes('blue')) return '藍色';
            if (c.includes('紫') || c.includes('purple')) return '紫色';
            if (c.includes('黃') || c.includes('黄') || c.includes('yellow')) return '黃色';
            return '彩色';
        };

        const mapCSVToMemories = (csvArray) => {
            if (csvArray.length < 2) return [];
            
            const headers = csvArray[0].map(h => h ? h.replace(/^\uFEFF/, '').trim().toLowerCase() : '');
            const rows = csvArray.slice(1);

            return rows.map((row, index) => {
                const getVal = (possibleKeys, defaultVal) => {
                    for (const key of possibleKeys) {
                        const normalizedKey = key.toLowerCase();
                        let idx = headers.findIndex(h => h === normalizedKey);
                        if (idx === -1) idx = headers.findIndex(h => h.includes(normalizedKey));

                        if (idx !== -1 && row[idx] !== undefined && row[idx] !== null && row[idx].trim() !== '') {
                        return row[idx].trim();
                        }
                    }
                    return defaultVal;
                };

                const rawEffects = getVal(['特殊效果', 'extra', 'effects', '效果', '特性'], '');
                const effects = rawEffects ? rawEffects.split(/[,、\n]/).map(s => s.trim()).filter(Boolean) : [];
                
                const jpName = getVal(['name', '名稱', '名字', '日文名稱'], '');
                if (!jpName) return null; 
                
                const cName = getVal(['c_name', 'cname', '中文名稱', '中譯'], '');
                const displayName = cName ? `${jpName} (${cName})` : jpName;

                return {
                    id: index + 1,
                    name: displayName,
                    color: normalizeColor(getVal(['顏色', 'color', '屬性'], '彩色')),
                    cost: parseSafeNumber(getVal(['cost', '花費'], '0')),
                    hp: parseSafeNumber(getVal(['hp', '血量'], '0')),
                    atk: parseSafeNumber(getVal(['攻擊力', 'atk', '攻擊'], '0')),
                    matk: parseSafeNumber(getVal(['攻擊魔力', 'm_atk', 'matk', '魔攻'], '0')),
                    heal: parseSafeNumber(getVal(['回復魔力', 'heal', '回復', '回血'], '0')),
                    def: parseSafeNumber(getVal(['守備力', 'def', '防禦'], '0')),
                    mdef: parseSafeNumber(getVal(['魔法守備力', 'm_def', 'mdef', '魔防'], '0')),
                    dex: parseSafeNumber(getVal(['靈巧', 'dex', '速度'], '0')),
                    effects: effects
                };
            }).filter(item => item !== null);
        };

        const calculateCostByLevel = (level, isAdvanced) => {
            const lv = Math.max(1, Math.min(55, level));
            if (!isAdvanced) return lv * 5 + 5;
            const diff = lv - 1;
            const pairs = Math.floor(diff / 2);
            const remainder = diff % 2;
            return 150 + (pairs * 9) + (remainder * 4);
        };

        const isJobAdvanced = (jobName) => {
            const advancedCategory = JOB_CATEGORIES.find(c => c.category === '上級職');
            return advancedCategory ? advancedCategory.jobs.some(j => j.name === jobName) : false;
        };

        const getScore = (mem, sortOption, multiplier = 1, isPhysicalJob = true) => {
            let s = 0;
            switch(sortOption) {
                case 'comprehensive': 
                s = mem.atk + mem.matk + (isPhysicalJob ? mem.atk : mem.matk);
                break;
                case 'atk_matk': s = (mem.atk + mem.matk); break;
                case 'atk': s = mem.atk; break;
                case 'matk': s = mem.matk; break;
                case 'heal': s = mem.heal; break;
                case 'def': s = mem.def; break;
                case 'mdef': s = mem.mdef; break;
                case 'dex': s = mem.dex; break;
                case 'hp': s = mem.hp; break;
                default: s = mem.atk;
            }
            return Math.floor(s * multiplier);
        };

        const reduceMemoriesPool = (allMemories, classSlots, sortOption, selectedEffects, costLimit, isPhysicalJob) => {
            const validMemories = allMemories.filter(m => m.cost <= costLimit);
            const poolSet = new Map();

            const addMem = (m) => { if (!poolSet.has(m.id)) poolSet.set(m.id, m); };

            if (selectedEffects.length > 0) {
                const effectMems = validMemories.filter(m => selectedEffects.some(eff => m.effects.includes(eff)));
                effectMems.sort((a, b) => getScore(b, sortOption, 1.2, isPhysicalJob) - getScore(a, sortOption, 1.2, isPhysicalJob));
                effectMems.slice(0, 20).forEach(addMem);
            }

            const neededColors = new Set();
            classSlots.forEach(slot => {
                if (slot !== '彩色') slot.split('/').forEach(c => neededColors.add(c));
            });

            neededColors.forEach(color => {
                const colorMems = validMemories.filter(m => m.color === color);
                colorMems.sort((a, b) => getScore(b, sortOption, 1.2, isPhysicalJob) - getScore(a, sortOption, 1.2, isPhysicalJob));
                colorMems.slice(0, 12).forEach(addMem);
            });

            const overallMems = [...validMemories].sort((a, b) => getScore(b, sortOption, 1.2, isPhysicalJob) - getScore(a, sortOption, 1.2, isPhysicalJob));
            overallMems.slice(0, 15).forEach(addMem);

            return Array.from(poolSet.values());
        };

        const getPermutations = (arr) => {
            if (arr.length <= 1) return [arr];
            const result = [];
            for (let i = 0; i < arr.length; i++) {
                const current = arr[i];
                const remaining = arr.slice(0, i).concat(arr.slice(i + 1));
                const remainingPerms = getPermutations(remaining);
                for (let j = 0; j < remainingPerms.length; j++) {
                result.push([current, ...remainingPerms[j]]);
                }
            }
            return result;
        };

        const evaluatePlacement = (memoriesPermutation, classSlots, sortOption, isPhysicalJob) => {
            let stats = { hp: 0, atk: 0, matk: 0, heal: 0, def: 0, mdef: 0, dex: 0 };
            let placement = [];

            for (let i = 0; i < classSlots.length; i++) {
                const slotColor = classSlots[i];
                const mem = memoriesPermutation[i] || null;

                if (mem) {
                let isMatched = false;
                if (slotColor === '彩色') {
                    isMatched = true;
                } else if (slotColor.includes('/')) {
                    isMatched = slotColor.split('/').includes(mem.color);
                } else {
                    isMatched = slotColor === mem.color;
                }

                const multiplier = isMatched ? 1.2 : 1.0;
                
                stats.hp += Math.floor(mem.hp * multiplier);
                stats.atk += Math.floor(mem.atk * multiplier);
                stats.matk += Math.floor(mem.matk * multiplier);
                stats.heal += Math.floor(mem.heal * multiplier);
                stats.def += Math.floor(mem.def * multiplier);
                stats.mdef += Math.floor(mem.mdef * multiplier);
                stats.dex += Math.floor(mem.dex * multiplier);
                
                placement.push({ memory: mem, isMatched });
                } else {
                placement.push(null);
                }
            }

            let score = 0;
            switch(sortOption) {
                case 'comprehensive':
                score = stats.atk + stats.matk + (isPhysicalJob ? stats.atk : stats.matk);
                break;
                case 'atk_matk': score = stats.atk + stats.matk; break;
                case 'atk': score = stats.atk; break;
                case 'matk': score = stats.matk; break;
                case 'heal': score = stats.heal; break;
                case 'def': score = stats.def; break;
                case 'mdef': score = stats.mdef; break;
                case 'dex': score = stats.dex; break;
                case 'hp': score = stats.hp; break;
                default: score = stats.atk;
            }

            return { placement, stats, score };
        };

        const findOptimalPlacement = (memories, classSlots, sortOption, isPhysicalJob) => {
            let paddedMemories = [...memories];
            while (paddedMemories.length < classSlots.length) {
                paddedMemories.push(null);
            }
            
            const perms = getPermutations(paddedMemories);
            let bestResult = null;
            let bestScore = -1;

            for (const perm of perms) {
                const evaluated = evaluatePlacement(perm, classSlots, sortOption, isPhysicalJob);
                if (evaluated.score > bestScore) {
                bestScore = evaluated.score;
                bestResult = evaluated;
                }
            }
            
            return bestResult; 
        };

        const computeCombinations = (allMems, limit, sort, effects, classSlots, jobName) => {
            const isPhysicalJob = PHYSICAL_JOBS.includes(jobName);
            const pool = reduceMemoriesPool(allMems, classSlots, sort, effects, limit, isPhysicalJob);
            const maxSlots = classSlots.length;
            let validCombs = [];
            
            const generate = (index, currentComb, currentCost) => {
                if (currentComb.length > maxSlots) return;

                if (currentComb.length > 0) {
                let hasAllEffects = true;
                if (effects.length > 0) {
                    let combined = new Set();
                    for(let i=0; i<currentComb.length; i++) {
                        let effs = currentComb[i].effects;
                        for(let j=0; j<effs.length; j++) combined.add(effs[j]);
                    }
                    for(let i=0; i<effects.length; i++) {
                        if(!combined.has(effects[i])) { hasAllEffects = false; break; }
                    }
                }
                
                if (hasAllEffects) {
                    const optimal = findOptimalPlacement(currentComb, classSlots, sort, isPhysicalJob);
                    validCombs.push({
                    placement: optimal.placement,
                    totalCost: currentCost,
                    stats: optimal.stats,
                    score: optimal.score
                    });
                }
                }
                
                if (index === pool.length) return;
                
                generate(index + 1, currentComb, currentCost); // 不加入
                
                const mem = pool[index];
                if (currentCost + mem.cost <= limit && currentComb.length < maxSlots) {
                currentComb.push(mem);
                generate(index + 1, currentComb, currentCost + mem.cost); // 加入
                currentComb.pop();
                }
            };
            
            generate(0, [], 0);
            
            validCombs.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return a.totalCost - b.totalCost; 
            });
            
            const uniqueCombs = [];
            const seenStr = new Set();
            for (let c of validCombs) {
                const memIds = c.placement.map(p => p?.memory?.id || 0).join(',');
                if (!seenStr.has(memIds)) {
                seenStr.add(memIds);
                uniqueCombs.push(c);
                if (uniqueCombs.length >= 10) break;
                }
            }
            
            return uniqueCombs;
        };

        // === 主程式 Component ===
        function App() {
            const [selectedJob, setSelectedJob] = useState(JOB_CATEGORIES[0].jobs[0]);
            const [sortBy, setSortBy] = useState(JOB_CATEGORIES[0].jobs[0].recommendedSort);
            
            const [selectedLevelOption, setSelectedLevelOption] = useState('55'); 
            const [manualCostLimit, setManualCostLimit] = useState(255);
            
            const [selectedEffects, setSelectedEffects] = useState([]);
            const [excludedMemories, setExcludedMemories] = useState([]); 
            
            const [results, setResults] = useState([]);
            const [isCalculating, setIsCalculating] = useState(false);
            const [hasSearched, setHasSearched] = useState(false);

            const [memoriesDatabase, setMemoriesDatabase] = useState([]);
            const [availableEffects, setAvailableEffects] = useState([]);
            const [isFetchingData, setIsFetchingData] = useState(true);
            const [fetchStatus, setFetchStatus] = useState({ type: 'loading', message: '正在載入最新記憶體資料庫...' });

            useEffect(() => {
                const fetchMemories = async () => {
                try {
                    const response = await fetch(SHEET_CSV_URL);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    const csvText = await response.text();
                    const csvArray = parseCSV(csvText);
                    const parsedData = mapCSVToMemories(csvArray);
                    
                    if (parsedData.length > 0) {
                        setMemoriesDatabase(parsedData);
                        setFetchStatus({ type: 'success', message: `成功載入 ${parsedData.length} 筆最新資料` });
                        
                        const effectsSet = new Set();
                        parsedData.forEach(m => m.effects.forEach(e => {
                            if (e && e !== '') effectsSet.add(e);
                        }));
                        setAvailableEffects(Array.from(effectsSet).sort());
                    } else {
                        throw new Error('解析後資料為空，請確認欄位名稱對應。');
                    }
                } catch (error) {
                    console.warn("無法取得遠端試算表或解析失敗，改用備用模擬資料:", error);
                    setMemoriesDatabase(FALLBACK_MEMORIES);
                    setFetchStatus({ type: 'error', message: '遠端讀取失敗，已啟用備用資料' });
                    
                    const effectsSet = new Set();
                    FALLBACK_MEMORIES.forEach(m => m.effects.forEach(e => effectsSet.add(e)));
                    setAvailableEffects(Array.from(effectsSet).sort());
                } finally {
                    setIsFetchingData(false);
                }
                };
                fetchMemories();
            }, []);

            const isAdvanced = isJobAdvanced(selectedJob.name);
            const isManual = selectedLevelOption === 'manual';
            const jobLevel = isManual ? 55 : Number(selectedLevelOption);
            const autoCalculatedCost = calculateCostByLevel(jobLevel, isAdvanced);
            const effectiveCostLimit = isManual ? manualCostLimit : autoCalculatedCost;

            const handleJobSelect = (job) => {
                setSelectedJob(job);
                setSortBy(job.recommendedSort);
            };

            const handleToggleEffect = (effect) => {
                if (selectedEffects.includes(effect)) {
                setSelectedEffects(selectedEffects.filter(e => e !== effect));
                } else {
                setSelectedEffects([...selectedEffects, effect]);
                }
            };

            const runSimulation = (currentExcluded = excludedMemories) => {
                setIsCalculating(true);
                setHasSearched(true);
                
                setTimeout(() => {
                const activeDatabase = memoriesDatabase.filter(m => !currentExcluded.includes(m.id));
                const res = computeCombinations(activeDatabase, effectiveCostLimit, sortBy, selectedEffects, selectedJob.slots, selectedJob.name);
                setResults(res);
                setIsCalculating(false);
                }, 50);
            };

            const handleCalculate = () => runSimulation();

            const handleExcludeMemory = (id) => {
                const newExcluded = [...excludedMemories, id];
                setExcludedMemories(newExcluded);
                runSimulation(newExcluded); 
            };

            const handleRestoreMemory = (id) => {
                const newExcluded = excludedMemories.filter(eid => eid !== id);
                setExcludedMemories(newExcluded);
                runSimulation(newExcluded); 
            };

            const handleReset = () => {
                setSelectedJob(JOB_CATEGORIES[0].jobs[0]);
                setSortBy(JOB_CATEGORIES[0].jobs[0].recommendedSort);
                setSelectedLevelOption('55');
                setManualCostLimit(255);
                setSelectedEffects([]);
                setExcludedMemories([]);
                setResults([]);
                setHasSearched(false);
            };

            const renderSlotText = (slotColor) => {
                if (slotColor === '彩色') {
                return <div style={{ writingMode: 'vertical-rl' }} className="tracking-widest font-black drop-shadow-md">彩色格</div>;
                }
                if (slotColor.includes('/')) {
                const [color1, color2] = slotColor.split('/');
                return (
                    <div className="flex flex-col items-center justify-center font-black drop-shadow-[0_1px_1.5px_rgba(0,0,0,0.8)] text-white">

                    <div className="text-[10px] my-1 opacity-90 rotate-90 leading-none">/</div>
                    <div style={{ writingMode: 'vertical-rl' }} className="tracking-widest leading-none pb-1">{color2}</div>
                    </div>
                );
                }
                return <div style={{ writingMode: 'vertical-rl' }} className="tracking-widest font-black drop-shadow-md">{slotColor}格</div>;
            };

            if (isFetchingData) {
                return (
                <div className="min-h-screen bg-slate-100 flex flex-col items-center justify-center text-slate-500 font-bold gap-3">
                    <RefreshCw className="w-10 h-10 animate-spin text-blue-500" />

                                    placeholder="輸入上限"
                                />
                                </div>
                            ) : (
                                <div className="bg-blue-50 border border-blue-200 rounded-xl p-3.5 flex justify-between items-center shadow-inner transition-opacity duration-200">
                                <span className="text-sm text-blue-700 font-bold flex items-center gap-1.5">
                                    <Calculator className="w-4 h-4" />
                                    當前上限 ({isAdvanced ? '上級職' : '基本職'})
                                </span>
                                <span className="text-2xl font-black text-blue-700 leading-none">{autoCalculatedCost}</span>
                                </div>
                            )}
                            </div>
                        </div>

                        <div>
                            <label className="block text-sm font-bold text-slate-700 mb-2">必須包含的特殊效果 (自動從資料庫抓取)</label>
                            <div className="flex flex-wrap gap-2 max-h-[160px] overflow-y-auto pr-2 custom-scrollbar">
                            {availableEffects.length === 0 && <span className="text-sm text-slate-400">尚無特殊效果標籤</span>}
                            {availableEffects.map(effect => (
                                <button
                                key={effect}
                                onClick={() => handleToggleEffect(effect)}
                                className={`px-3 py-1.5 rounded-lg text-sm border flex items-center gap-1.5 transition-colors ${
                                    selectedEffects.includes(effect) 
                                    ? 'bg-emerald-50 border-emerald-300 text-emerald-700 font-bold shadow-sm' 
                                    : 'bg-white border-slate-300 text-slate-600 font-medium hover:bg-slate-50'
                                }`}
                                >
                                <div className={`w-4 h-4 rounded-full shrink-0 flex items-center justify-center border ${selectedEffects.includes(effect) ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300'}`}>
                                    {selectedEffects.includes(effect) && <Check className="w-3 h-3" />}
                                </div>
                                {effect}
                                </button>
                            ))}
                            </div>
                        </div>
                        </div>

                        {excludedMemories.length > 0 && (
                        <div className="p-4 bg-red-50/70 border border-red-200 rounded-xl transition-opacity duration-200">
                            <label className="block text-sm font-bold text-red-700 mb-3 flex items-center gap-1.5">
                            <Ban className="w-4 h-4" /> 已排除的記憶體 (點擊恢復並重算)
                            </label>
                            <div className="flex flex-wrap gap-2">
                            {excludedMemories.map(id => {
                                const mem = memoriesDatabase.find(m => m.id === id);
                                if (!mem) return null;
                                return (
                                <button
                                    key={id}
                                    onClick={() => handleRestoreMemory(id)}
                                    title="恢復此記憶體"
                                    className="px-2.5 py-1.5 bg-white border border-red-300 text-red-600 rounded-lg text-xs font-bold flex items-center gap-1.5 hover:bg-red-100 hover:text-red-700 hover:border-red-400 transition-colors shadow-sm"
                                >
                                    {mem.name} <X className="w-3 h-3" />
                                </button>
                                );
                            })}
                            </div>
                        </div>
                        )}
                        
                        <div className="flex flex-col md:flex-row gap-3 pt-2">
                        <button 
                            onClick={handleReset}
                            disabled={isCalculating}
                            className="w-full md:w-auto px-6 py-3.5 bg-slate-200 text-slate-700 hover:bg-slate-300 font-bold rounded-xl shadow-sm transition-all flex items-center justify-center gap-2 active:scale-[0.98]"
                        >
                            <RotateCcw className="w-5 h-5" /> 重置設定
                        </button>
                        <button 
                            onClick={handleCalculate}
                            disabled={isCalculating}
                            className="w-full flex-1 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 active:scale-[0.98]"
                        >
                            {isCalculating ? (
                                <div className="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
                            ) : (
                                <Search className="w-5 h-5" />
                            )}
                            {isCalculating ? '正在精算最佳搭配...' : `開始模擬最佳編成 (Cost上限: ${effectiveCostLimit})`}
                        </button>
                        </div>
                    </div>
                    </div>

                    {hasSearched && !isCalculating && results.length === 0 && (
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center text-slate-500">
                        <Activity className="w-12 h-12 mx-auto mb-3 text-slate-300" />
                        <p className="font-bold text-slate-700">沒有符合條件的編成組合</p>
                        <p className="text-sm mt-1">請嘗試提高等級/Cost上限，或減少必須的特殊效果。</p>
                    </div>
                    )}

                    {results.length > 0 && (
                    <div className="space-y-5">
                        <h2 className="text-lg font-extrabold text-slate-800 flex items-center gap-2 ml-1">
                        <Star className="w-5 h-5 text-yellow-500 fill-current" />
                        推薦編成結果 (Top {results.length})
                        </h2>
                        
                        {results.map((res, i) => (
                        <div key={i} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden transition-all hover:shadow-lg">
                            
                            <div className="bg-gradient-to-r from-slate-800 to-slate-700 p-3 px-4 flex justify-between items-center text-white">
                            <div className="font-bold flex items-center gap-2">
                                <span className="bg-blue-500 text-white text-xs px-2.5 py-1 rounded font-black shadow-sm">#{i + 1}</span>
                                <span className="tracking-wide text-sm md:text-base">推薦組合</span>
                            </div>
                            <div className="text-sm font-black text-white bg-slate-900/50 px-3 py-1 rounded-full border border-slate-600 flex items-center gap-1.5 shadow-inner">
                                評分: {res.score}
                            </div>
                            </div>
                            
                            <div className="grid grid-cols-4 md:grid-cols-8 gap-[1px] bg-slate-200 border-b border-slate-200 text-center relative z-10 shadow-sm">

                                            <div className="flex items-center gap-1.5 shrink-0 ml-2">
                                                {slot.isMatched && (
                                                <span className={`border text-[10px] font-black px-1.5 py-0.5 rounded shadow-sm flex items-center gap-0.5 ${slotColor === '彩色' ? 'bg-gradient-to-r from-pink-100 to-blue-100 text-blue-700 border-blue-300' : 'bg-yellow-100 text-yellow-700 border-yellow-400'}`}>
                                                    <Sparkles className="w-2.5 h-2.5" /> 1.2x
                                                </span>
                                                )}
                                                <button 
                                                onClick={() => handleExcludeMemory(slot.memory.id)}
                                                title="我沒有這張記憶體，排除並重新計算"
                                                className="text-[10px] text-slate-400 hover:text-red-600 bg-slate-50 hover:bg-red-50 border border-slate-200 hover:border-red-200 px-1.5 py-0.5 rounded flex items-center gap-0.5 transition-all shadow-sm"
                                                >
                                                <Ban className="w-3 h-3" /> 排除
                                                </button>
                                            </div>
                                            </div>
                                            
                                            <div className="flex flex-wrap gap-x-2 gap-y-1 text-[11px] text-slate-500 font-medium mt-1">
                                            <span className="bg-slate-100 px-1.5 py-0.5 rounded text-slate-700 border border-slate-200">Cost {slot.memory.cost}</span>
                                            <span className={slot.isMatched && slot.memory.hp > 0 ? 'text-rose-600 font-bold' : ''}>HP {Math.floor(slot.memory.hp * (slot.isMatched ? 1.2 : 1))}</span>
                                            <span className={slot.isMatched && slot.memory.atk > 0 ? 'text-amber-600 font-bold' : ''}>攻 {Math.floor(slot.memory.atk * (slot.isMatched ? 1.2 : 1))}</span>
                                            <span className={slot.isMatched && slot.memory.matk > 0 ? 'text-purple-600 font-bold' : ''}>魔 {Math.floor(slot.memory.matk * (slot.isMatched ? 1.2 : 1))}</span>
                                            <span className={slot.isMatched && slot.memory.heal > 0 ? 'text-emerald-600 font-bold' : ''}>回 {Math.floor(slot.memory.heal * (slot.isMatched ? 1.2 : 1))}</span>
                                            <span className={slot.isMatched && slot.memory.def > 0 ? 'text-blue-600 font-bold' : ''}>守 {Math.floor(slot.memory.def * (slot.isMatched ? 1.2 : 1))}</span>
                                            <span className={slot.isMatched && slot.memory.mdef > 0 ? 'text-indigo-600 font-bold' : ''}>魔防 {Math.floor(slot.memory.mdef * (slot.isMatched ? 1.2 : 1))}</span>
                                            <span className={slot.isMatched && slot.memory.dex > 0 ? 'text-orange-600 font-bold' : ''}>巧 {Math.floor(slot.memory.dex * (slot.isMatched ? 1.2 : 1))}</span>
                                            </div>

                                            {slot.memory.effects.length > 0 && (
                                            <div className="flex flex-wrap gap-1 mt-2">
                                                {slot.memory.effects.map(e => (
                                                <span key={e} className="text-[10px] px-2 py-0.5 bg-slate-50 text-slate-600 border border-slate-200 rounded font-semibold whitespace-nowrap">
                                                    {e}
                                                </span>
                                                ))}
                                            </div>
                                            )}
                                        </>
                                        ) : (
                                        <div className="text-slate-400 text-sm font-bold flex items-center justify-center h-full">
                                            (未裝備記憶體)
                                        </div>
                                        )}
                                    </div>
                                    </div>
                                );
                                })}
                            </div>
                            </div>

                        </div>
                        ))}
                    </div>
                    )}
                </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
